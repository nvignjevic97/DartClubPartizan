# Known search/AI crawler user-agents get a plain server-rendered HTML snapshot of the public
# pages (see backend's SeoController) instead of the React app shell, since most of them never
# run JavaScript and would otherwise see an empty page. Everyone else still gets the normal SPA.
map $http_user_agent $is_bot {
    default 0;
    "~*googlebot" 1;
    "~*bingbot" 1;
    "~*duckduckbot" 1;
    "~*yandexbot" 1;
    "~*baiduspider" 1;
    "~*slurp" 1;
    "~*facebookexternalhit" 1;
    "~*twitterbot" 1;
    "~*linkedinbot" 1;
    "~*whatsapp" 1;
    "~*telegrambot" 1;
    "~*discordbot" 1;
    "~*slackbot" 1;
    "~*applebot" 1;
    "~*gptbot" 1;
    "~*chatgpt-user" 1;
    "~*oai-searchbot" 1;
    "~*claudebot" 1;
    "~*claude-user" 1;
    "~*anthropic-ai" 1;
    "~*ccbot" 1;
    "~*perplexitybot" 1;
    "~*google-extended" 1;
    "~*bytespider" 1;
    "~*diffbot" 1;
    "~*ahrefsbot" 1;
    "~*semrushbot" 1;
    "~*mj12bot" 1;
}

# Which backend /seo/... snapshot (if any) matches this request's URI, computed purely from $uri.
# Using map's own named capture here (rather than a location's $1) keeps it safe from nginx's
# "if clears numbered regex captures" gotcha.
map $uri $seo_path {
    default '';
    '/' 'home';
    '/news' 'news';
    '/about' 'about';
    '~^/news/(?<newsid>\d+)$' 'news/$newsid';
}

# Non-empty only when this is both a known public page AND a bot - this is what we redirect on.
map $is_bot$seo_path $seo_redirect {
    default '';
    '~^1(?<p>.+)$' $p;
}

server {
  listen 80;
  client_max_body_size 200m;
  root /usr/share/nginx/html;
  proxy_set_header Host $host;

  location = /robots.txt {
    proxy_pass http://backend:8080/robots.txt;
  }
  location = /sitemap.xml {
    proxy_pass http://backend:8080/sitemap.xml;
  }

  location /api/ {
    proxy_pass http://backend:8080;
  }

  # Internal-only: proxies to the backend's bot-facing HTML snapshot. Never hit directly by a
  # client - only reached via the rewrite below.
  location /__seo/ {
    internal;
    rewrite ^/__seo/(.*)$ /seo/$1 break;
    proxy_pass http://backend:8080;
  }

  location / {
    if ($seo_redirect) { rewrite ^ /__seo/$seo_redirect last; }
    try_files $uri /index.html;
  }
}
