# Known search/AI crawler user-agents get a plain server-rendered HTML snapshot of the public
# pages (see backend's SeoController) instead of the React app shell, since most of them never
# run JavaScript and would otherwise see an empty page. Everyone else still gets the normal SPA.
map $http_user_agent $is_bot {
    default 0;
    "~*googlebot" 1;
    "~*bingbot" 1;
    "~*duckduckbot" 1;
    "~*yandexbot" 1;
    "~*baiduspider" 1;
    "~*slurp" 1;
    "~*facebookexternalhit" 1;
    "~*twitterbot" 1;
    "~*linkedinbot" 1;
    "~*whatsapp" 1;
    "~*telegrambot" 1;
    "~*discordbot" 1;
    "~*slackbot" 1;
    "~*applebot" 1;
    "~*gptbot" 1;
    "~*chatgpt-user" 1;
    "~*oai-searchbot" 1;
    "~*claudebot" 1;
    "~*claude-user" 1;
    "~*anthropic-ai" 1;
    "~*ccbot" 1;
    "~*perplexitybot" 1;
    "~*google-extended" 1;
    "~*bytespider" 1;
    "~*diffbot" 1;
    "~*ahrefsbot" 1;
    "~*semrushbot" 1;
    "~*mj12bot" 1;
}

server {
  listen 80;
  client_max_body_size 10m;
  root /usr/share/nginx/html;

  location = /robots.txt {
    proxy_pass http://backend:8080/robots.txt;
    proxy_set_header Host $host;
  }
  location = /sitemap.xml {
    proxy_pass http://backend:8080/sitemap.xml;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location = / {
    if ($is_bot) {
        proxy_set_header Host $host;
        proxy_pass http://backend:8080/seo/home;
    }
    try_files /index.html /index.html;
  }
  location = /news {
    if ($is_bot) {
        proxy_set_header Host $host;
        proxy_pass http://backend:8080/seo/news;
    }
    try_files /index.html /index.html;
  }
  location ~ ^/news/(\d+)$ {
    if ($is_bot) {
        proxy_set_header Host $host;
        proxy_pass http://backend:8080/seo/news/$1;
    }
    try_files /index.html /index.html;
  }
  location = /about {
    if ($is_bot) {
        proxy_set_header Host $host;
        proxy_pass http://backend:8080/seo/about;
    }
    try_files /index.html /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
