services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-club}
      MARIADB_USER: ${DB_USER:-club}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required - set it in .env}
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-club}
      DB_USER: ${DB_USER:-club}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required - set it in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required - set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Account-approval / password-reset emails are off until you fill these in (see README).
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@club.local}

  frontend:
    build: ./frontend
    depends_on: [backend]
    expose: ["80"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
